<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生产数据看板</title>
<script src="https://unpkg.com/@supabase/supabase-js/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body {margin:0;font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;background:#f5f5f5;color:#000;}
header {position:fixed;top:0;left:0;right:0;background:#fff;z-index:1000;border-bottom:1px solid #ccc;padding:5px 10px;display:flex;flex-direction:column;}
#title-bar {display:flex;justify-content:space-between;align-items:center;}
#dashboard-title {font-size:18px;font-weight:bold;cursor:text;}
#meta-info {font-size:12px;color:#555;}
#status-indicator {width:12px;height:12px;border-radius:50%;margin-left:5px;display:inline-block;background:red;animation:none;}
#tabs {display:flex;align-items:center;margin-top:5px;}
.tab {background:#eee;padding:5px 10px;margin-right:5px;border-radius:5px;display:flex;align-items:center;cursor:pointer;user-select:none;}
.tab.active {background:#ddd;font-weight:bold;}
.tab button {border:none;background:none;margin-left:3px;cursor:pointer;}
#add-tab {padding:5px 10px;background:#ddd;border-radius:5px;cursor:pointer;}
.container {margin-top:90px;padding:10px;}
.card {background:#fff;border-radius:8px;padding:10px;margin-bottom:10px;overflow-x:auto;}
#chart-container {height:300px;}
table {width:100%;border-collapse:collapse;min-width:1200px;}
th,td {border:1px solid #ccc;padding:5px;text-align:center;white-space:nowrap;}
.summary {background:#fff3b0;font-weight:bold;}
.total-summary {background:#b0e0ff;font-weight:bold;}
input[type=number] {width:70px;}
input:focus {outline:none;background:#e0f7ff;cursor:text;}
button {cursor:pointer;}
</style>
</head>
<body>
<header>
<div id="title-bar">
<div>
<span id="dashboard-title" contenteditable="true">生产数据看板</span>
<span id="status-indicator"></span>
</div>
<div id="meta-info">制作人：陈港华 · 2021-12-7 · 版本 1.0</div>
</div>
<div id="tabs"></div>
</header>
<div class="container">
<div class="card">
<div style="margin-bottom:5px;">
<label><input type="checkbox" class="chart-line" data-line="后焊产量" checked>后焊产量</label>
<label><input type="checkbox" class="chart-line" data-line="组装产量" checked>组装产量</label>
<label><input type="checkbox" class="chart-line" data-line="包装产量" checked>包装产量</label>
<label><input type="checkbox" class="chart-line" data-line="总产量" checked>总产量</label>
<label><input type="checkbox" class="chart-line" data-line="外观不良" checked>外观不良</label>
<label><input type="checkbox" class="chart-line" data-line="功能不良" checked>功能不良</label>
<label><input type="checkbox" class="chart-line" data-line="不良品总数" checked>不良品总数</label>
<label><input type="checkbox" class="chart-line" data-line="不良品率" checked>不良品率</label>
<label><input type="checkbox" class="chart-line" data-line="UPPH" checked>UPPH</label>
<label><input type="checkbox" class="chart-line" data-line="总单价" checked>总单价</label>
<a href="#" id="open-link" style="margin-left:20px;">工序工位节拍数据</a>
</div>
<canvas id="lineChart" height="300"></canvas>
</div>
<div class="card">
<div style="margin-bottom:5px;">
<button id="add-day">＋ 添加一天</button>
<button id="delete-all">🗑 删除全部</button>
</div>
<table id="data-table">
<thead>
<tr>
<th>日期</th><th>工序</th><th>生产数量</th><th>外观制程不良</th><th>外观来料不良</th><th>功能制程不良</th><th>功能来料不良</th><th>不良品总数</th><th>不良品率</th><th>人数</th><th>当日工时</th><th>总工时</th><th>平均小时产能</th><th>UPPH</th><th>工序单价</th><th>操作</th>
</tr>
</thead>
<tbody></tbody>
<tfoot>
<tr class="total-summary"><td colspan="2">全部汇总</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>-</td><td>0</td><td>0</td><td>0</td><td>-</td><td>-</td><td>-</td><td></td></tr>
</tfoot>
</table>
</div>
<script>
const SUPABASE_URL = 'https://your-supabase-url.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_a3OQjdShFybq73P0rzpebg_pM90NvQV';
const supabase = supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let boards = [];
let currentBoard = '';
let dataStore = {};
let chart = null;
const statusIndicator = document.getElementById('status-indicator');

function updateStatus(status){
statusIndicator.style.animation='none';
if(status==='online'){statusIndicator.style.background='green';}
else if(status==='syncing'){statusIndicator.style.background='orange';statusIndicator.style.animation='blink 1s infinite';}
else{statusIndicator.style.background='red';}
}
document.head.insertAdjacentHTML('beforeend','<style>@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}</style>');

function createTab(name){
const tab = document.createElement('div');
tab.className='tab';
tab.textContent=name;
tab.dataset.name=name;
tab.addEventListener('click',()=>{setCurrentBoard(name);});
const editBtn = document.createElement('button');editBtn.textContent='✎';
editBtn.addEventListener('click',(e)=>{e.stopPropagation();const newName=prompt('输入标签名',tab.dataset.name);if(newName){renameBoard(tab.dataset.name,newName);}});
tab.appendChild(editBtn);
if(boards.length>0){const delBtn = document.createElement('button');delBtn.textContent='×';delBtn.addEventListener('click',(e)=>{e.stopPropagation();if(confirm('确认删除该标签及所有数据?')){deleteBoard(tab.dataset.name);}});tab.appendChild(delBtn);}
document.getElementById('tabs').insertBefore(tab,document.getElementById('add-tab'));
boards.push(name);
dataStore[name]=[];
}

function setCurrentBoard(name){
currentBoard=name;
document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
document.querySelectorAll('.tab').forEach(t=>{if(t.dataset.name===name)t.classList.add('active');});
renderTable();
renderChart();
}

function renameBoard(oldName,newName){
boards=boards.map(b=>b===oldName?newName:b);
dataStore[newName]=dataStore[oldName];
delete dataStore[oldName];
document.querySelectorAll('.tab').forEach(t=>{if(t.dataset.name===oldName)t.dataset.name=newName;t.firstChild.textContent=newName;});
if(currentBoard===oldName)currentBoard=newName;
}

function deleteBoard(name){
boards=boards.filter(b=>b!==name);
delete dataStore[name];
if(currentBoard===name)currentBoard=boards[0]||'';
document.getElementById('tabs').innerHTML='<div id="add-tab">＋</div>';
boards.forEach(b=>createTabElement(b));
createAddTab();
setCurrentBoard(currentBoard);
}

function createAddTab(){
document.getElementById('add-tab').addEventListener('click',()=>{const name=prompt('输入新标签名','新标签');if(name){createTab(name);setCurrentBoard(name);}});
}

function createTabElement(name){createTab(name);}

function fetchData(){updateStatus('syncing');supabase.from('production_records').select('*').then(res=>{if(res.error){updateStatus('offline');return;}res.data.forEach(row=>{if(!dataStore[row.board])dataStore[row.board]=[];dataStore[row.board].push(row);});updateStatus('online');setCurrentBoard(boards[0]||'');});}

function renderTable(){
const tbody=document.querySelector('#data-table tbody');tbody.innerHTML='';
if(!currentBoard)return;
const rows=dataStore[currentBoard]||[];
const grouped={};rows.forEach(r=>{if(!grouped[r.date])grouped[r.date]=[];grouped[r.date].push(r);});
for(const date in grouped){
grouped[date].forEach(r=>{tbody.appendChild(createRow(r));});
tbody.appendChild(createSummaryRow(date,grouped[date]));
}
updateTotalSummary();
}

function createRow(r){
const tr=document.createElement('tr');tr.dataset.date=r.date;tr.dataset.process=r.process;
tr.innerHTML=`<td>${r.date}</td><td>${r.process}</td>
<td><input type="number" value="${r.production_qty||0}"></td>
<td><input type="number" value="${r.cosmetic_process_defect||0}"></td>
<td><input type="number" value="${r.cosmetic_material_defect||0}"></td>
<td><input type="number" value="${r.functional_process_defect||0}"></td>
<td><input type="number" value="${r.functional_material_defect||0}"></td>
<td>-</td><td>-</td>
<td><input type="number" value="${r.workers||0}"></td>
<td><input type="number" value="${r.daily_hours||0}"></td>
<td>-</td><td>-</td><td>-</td><td>-</td>
<td><button>🗑</button></td>`;
tr.querySelectorAll('input').forEach(inp=>{inp.addEventListener('focus',e=>e.target.select());inp.addEventListener('input',()=>{updateCalculations();});});
tr.querySelector('button').addEventListener('click',()=>{if(confirm('确认删除该工序行?')){dataStore[currentBoard]=dataStore[currentBoard].filter(d=>!(d.date===r.date&&d.process===r.process));renderTable();}});
return tr;
}

function createSummaryRow(date,rows){
const tr=document.createElement('tr');tr.className='summary';tr.dataset.date=date;
tr.innerHTML=`<td colspan="2">汇总</td>
<td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td><td>-</td>
<td>0</td><td>0</td><td>0</td><td>-</td><td>-</td><td>-</td>
<td><button>删全天</button></td>`;
tr.querySelector('button').addEventListener('click',()=>{if(confirm('确认删除该日期所有数据?')){dataStore[currentBoard]=dataStore[currentBoard].filter(d=>d.date!==date);renderTable();}});
return tr;
}

function updateCalculations(){
const tbody=document.querySelector('#data-table tbody');
const rows=[...tbody.querySelectorAll('tr:not(.summary)')];
const grouped={};rows.forEach(r=>{const date=r.dataset.date;if(!grouped[date])grouped[date]=[];grouped[date].push(r);});
for(const date in grouped){
const sums={production_qty:0,cosmetic_process_defect:0,cosmetic_material_defect:0,functional_process_defect:0,functional_material_defect:0,workers:0,daily_hours:0};
grouped[date].forEach(tr=>{const v=n=>parseFloat(n.value)||0;
sums.production_qty+=v(tr.cells[2].firstChild);
sums.cosmetic_process_defect+=v(tr.cells[3].firstChild);
sums.cosmetic_material_defect+=v(tr.cells[4].firstChild);
sums.functional_process_defect+=v(tr.cells[5].firstChild);
sums.functional_material_defect+=v(tr.cells[6].firstChild);
sums.workers+=v(tr.cells[9].firstChild);
sums.daily_hours+=v(tr.cells[10].firstChild);
const defect=sums.cosmetic_process_defect+sums.cosmetic_material_defect+sums.functional_process_defect+sums.functional_material_defect;
const rate=tr.cells[2].firstChild.value>0?defect/tr.cells[2].firstChild.value*100:'-';
const total_hours=sums.workers*sums.daily_hours;
const avg_prod=sums.daily_hours>0?tr.cells[2].firstChild.value/tr.cells[10].firstChild.value:'-';
const upph=(tr.cells[9].firstChild.value*tr.cells[10].firstChild.value)>0?tr.cells[2].firstChild.value/(tr.cells[9].firstChild.value*tr.cells[10].firstChild.value):'-';
const price=(upph>0?20/(upph):'-');
tr.cells[7].textContent=defect.toFixed(2);
tr.cells[8].textContent=rate==='-'?'-':rate.toFixed(2)+'%';
tr.cells[11].textContent=total_hours.toFixed(2);
tr.cells[12].textContent=avg_prod==='-'?'-':avg_prod.toFixed(2);
tr.cells[13].textContent=upph==='-'?'-':upph.toFixed(2);
tr.cells[14].textContent=price==='-'?'-':price.toFixed(2);
});}
updateTotalSummary();
}

function updateTotalSummary(){
const tfoot=document.querySelector('#data-table tfoot tr');
const tbody=[...document.querySelectorAll('#data-table tbody tr.summary')];
let sums={production_qty:0,cosmetic_process_defect:0,cosmetic_material_defect:0,functional_process_defect:0,functional_material_defect:0,workers:0,daily_hours:0,total_price:0,count:0};
tbody.forEach(tr=>{const v=c=>parseFloat(tr.cells[c].textContent)||0;sums.production_qty+=v(2);sums.cosmetic_process_defect+=v(3);sums.cosmetic_material_defect+=v(4);sums.functional_process_defect+=v(5);sums.functional_material_defect+=v(6);sums.workers+=v(9);sums.daily_hours+=v(10);sums.total_price+=v(14);sums.count++;});
const total_defect=sums.cosmetic_process_defect+sums.cosmetic_material_defect+sums.functional_process_defect+sums.functional_material_defect;
const rate=sums.production_qty>0?total_defect/sums.production_qty*100:'-';
const avg_price=sums.count>0?sums.total_price/sums.count:0;
tfoot.cells[2].textContent=sums.production_qty.toFixed(2);
tfoot.cells[3].textContent=sums.cosmetic_process_defect.toFixed(2);
tfoot.cells[4].textContent=sums.cosmetic_material_defect.toFixed(2);
tfoot.cells[5].textContent=sums.functional_process_defect.toFixed(2);
tfoot.cells[6].textContent=sums.functional_material_defect.toFixed(2);
tfoot.cells[7].textContent=total_defect.toFixed(2);
tfoot.cells[8].textContent=rate==='-'?'-':rate.toFixed(2)+'%';
tfoot.cells[9].textContent=sums.workers.toFixed(2);
tfoot.cells[10].textContent=sums.daily_hours.toFixed(2);
tfoot.cells[11].textContent=(sums.workers*sums.daily_hours).toFixed(2);
tfoot.cells[12].textContent=(sums.production_qty/sums.daily_hours).toFixed(2);
tfoot.cells[13].textContent=(sums.production_qty/(sums.workers*sums.daily_hours)).toFixed(2);
tfoot.cells[14].textContent=avg_price.toFixed(2);
}

function renderChart(){const ctx=document.getElementById('lineChart').getContext('2d');if(chart)chart.destroy();chart=new Chart(ctx,{type:'line',data:{labels:[],datasets:[]},options:{responsive:true,interaction:{mode:'index',intersect:false},scales:{y:{type:'linear',position:'left'},y1:{type:'linear',position:'right'}}}});}

document.getElementById('add-day').addEventListener('click',()=>{const date=prompt('输入日期',new Date().toISOString().split('T')[0]);if(!date)return;const exists=(dataStore[currentBoard]||[]).some(d=>d.date===date);if(exists){alert('日期已存在');return;}['后焊','组装','包装'].forEach(p=>{dataStore[currentBoard].push({date,p,production_qty:0,cosmetic_process_defect:0,cosmetic_material_defect:0,functional_process_defect:0,functional_material_defect:0,workers:0,daily_hours:0,board:currentBoard});});renderTable();});

document.getElementById('delete-all').addEventListener('click',()=>{if(confirm('确认删除当前标签所有数据?')){dataStore[currentBoard]=[];renderTable();}});

document.addEventListener('click',(e)=>{if(e.target.tagName!=='INPUT'){saveData();}});

function saveData(){
updateStatus('syncing');const rows=dataStore[currentBoard]||[];rows.forEach(async r=>{await supabase.from('production_records').upsert(r,{onConflict:['date','process','board']});});updateStatus('online');}

createTab('陈港华');createTab('龙波章');createTab('戴腾昭');createTab('蔡旺知');createAddTab();setCurrentBoard('陈港华');fetchData();

document.querySelectorAll('.chart-line').forEach(cb=>{cb.addEventListener('change',()=>{renderChart();});});
document.getElementById('open-link').addEventListener('click',()=>{const url=prompt('输入网址');if(url)window.open(url,'_blank');});
</script>
</body>
</html>
