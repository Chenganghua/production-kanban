<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技改生产数据看板</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg: #f2f2f7; --card-bg: #ffffff; --border: #e0e0e0;
            --blue: #007AFF; --red: #FF3B30; --text: #000000;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
            --shadow-md: 0 4px 16px rgba(0,0,0,0.08);
            --radius-lg: 20px;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
        }
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{ font-family:var(--font); background:var(--bg); color:var(--text); padding:16px; display:flex; justify-content:center; }
        .app{ width:100%; max-width:1700px; }
        .nav-bar{ background:var(--card-bg); border-radius:var(--radius-lg); padding:14px 20px; display:flex; align-items:center; justify-content:space-between; border:1px solid var(--border); margin-bottom:16px; }
        .sync-indicator{ display:flex; align-items:center; gap:6px; font-size:12px; }
        .sync-dot{ width:8px; height:8px; border-radius:50%; background:#34C759; }
        .chart-card{ background:var(--card-bg); border-radius:var(--radius-lg); padding:16px; border:1px solid var(--border); margin-bottom:16px; }
        .chart-wrapper{ height:400px; }
        .data-card{ background:var(--card-bg); border-radius:var(--radius-lg); padding:16px; border:1px solid var(--border); }
        .btn{ padding:8px 16px; border-radius:24px; font-size:14px; font-weight:600; border:none; cursor:pointer; background:var(--blue); color:#fff; margin-bottom:12px; }
        table{ width:100%; border-collapse:collapse; font-size:11px; }
        th{ background:#f5f5f7; padding:6px 4px; font-size:10px; font-weight:700; border-bottom:2px solid #d0d0d0; }
        td{ padding:5px 4px; text-align:center; border-bottom:1px solid #ececec; }
        input[type="number"]{ width:60px; padding:5px 2px; border:1.5px solid #dcdcdc; border-radius:6px; font-size:11px; text-align:center; }
        @media (max-width:750px){ .chart-wrapper{ height:280px; } }
    </style>
</head>
<body>
<div class="app">
    <div class="nav-bar">
        <h2>生产数据看板</h2>
        <div class="sync-indicator"><span class="sync-dot" id="syncDot"></span><span id="syncText">连接中...</span></div>
        <div style="font-size:11px;">网页制作：陈港华</div>
    </div>
    <div class="chart-card">
        <div class="chart-wrapper"><canvas id="mainChart"></canvas></div>
    </div>
    <div class="data-card">
        <button class="btn" id="btnAdd">添加数据</button>
        <table>
            <thead><tr>
                <th>日期</th><th>工序</th><th>生产数量</th><th>外观制程不良</th><th>外观来料不良</th><th>功能制程不良</th><th>功能来料不良</th>
                <th>不良品总数</th><th>人数</th><th>当日工时</th><th>UPPH</th><th>工序单价</th><th>操作</th>
            </tr></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
(function() {
    const SUPABASE_URL = 'https://heialtqbftbmtvgemrld.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_a3OQjdShFybq73P0rzpebg_pM90NvQV';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let active = '陈港华';
    let allData = {};
    let chart;
    let pending = false;
    let dirty = false;

    const dot = document.getElementById('syncDot');
    const txt = document.getElementById('syncText');
    const tbody = document.getElementById('tableBody');
    const canvas = document.getElementById('mainChart');

    async function load() {
        dot.style.background = '#FF9500'; txt.textContent = '同步中...';
        try {
            const { data: rows, error } = await db.from('production_records').select('*').eq('board', active).order('date', { ascending: true });
            if (error) throw error;
            allData[active] = rows ? rows.map(r => ({
                id: r.id, date: r.date, process: r.process,
                prod: r.production_qty || 0,
                cosProc: r.cosmetic_process_defect || 0,
                cosMat: r.cosmetic_material_defect || 0,
                funcProc: r.functional_process_defect || 0,
                funcMat: r.functional_material_defect || 0,
                workers: r.workers || 0, hrs: r.daily_hours || 0
            })) : [];
            dot.style.background = '#34C759'; txt.textContent = '已连接';
            render();
            updChart();
        } catch (e) {
            console.error(e);
            dot.style.background = '#FF3B30'; txt.textContent = '离线';
        }
    }

    async function save() {
        const rows = allData[active] || [];
        if (!rows.length) return;
        await db.from('production_records').upsert(rows.map(r => ({
            date: r.date, process: r.process, board: active,
            production_qty: r.prod,
            cosmetic_process_defect: r.cosProc,
            cosmetic_material_defect: r.cosMat,
            functional_process_defect: r.funcProc,
            functional_material_defect: r.funcMat,
            workers: r.workers, daily_hours: r.hrs
        })), { onConflict: 'date, process, board' });
    }

    function totalDefect(r) { return r.cosProc + r.cosMat + r.funcProc + r.funcMat; }
    function upph(p, w, h) { return (w <= 0 || h <= 0 || p <= 0) ? 0 : p / (w * h); }

    function render() {
        const rows = allData[active] || [];
        tbody.innerHTML = '';
        if (!rows.length) {
            tbody.innerHTML = '<tr><td colspan="13">暂无数据</td></tr>';
            return;
        }
        const grp = {};
        rows.forEach(r => { if (!grp[r.date]) grp[r.date] = []; grp[r.date].push(r); });
        const dates = Object.keys(grp).sort();
        let h = '';
        dates.forEach(d => {
            const day = grp[d].sort((a,b) => ['后焊','组装','包装'].indexOf(a.process) - ['后焊','组装','包装'].indexOf(b.process));
            day.forEach(r => {
                const w = r.workers, hr = r.hrs;
                const td = totalDefect(r);
                const up = upph(r.prod, w, hr);
                const pr = up > 0 ? 20 / up : 0;
                h += `<tr>
                    <td>${d}</td><td>${r.process}</td>
                    <td><input type="number" value="${r.prod}" data-d="${d}" data-p="${r.process}" data-f="prod"></td>
                    <td><input type="number" value="${r.cosProc}" data-d="${d}" data-p="${r.process}" data-f="cosProc"></td>
                    <td><input type="number" value="${r.cosMat}" data-d="${d}" data-p="${r.process}" data-f="cosMat"></td>
                    <td><input type="number" value="${r.funcProc}" data-d="${d}" data-p="${r.process}" data-f="funcProc"></td>
                    <td><input type="number" value="${r.funcMat}" data-d="${d}" data-p="${r.process}" data-f="funcMat"></td>
                    <td>${td}</td>
                    <td><input type="number" value="${w}" data-d="${d}" data-p="${r.process}" data-f="workers"></td>
                    <td><input type="number" value="${hr}" data-d="${d}" data-p="${r.process}" data-f="hrs"></td>
                    <td>${up.toFixed(2)}</td>
                    <td>${pr > 0 ? '¥' + pr.toFixed(2) : '-'}</td>
                    <td><button class="del-p" data-d="${d}" data-p="${r.process}">❌️</button></td>
                </tr>`;
            });
        });
        tbody.innerHTML = h;
        document.querySelectorAll('input').forEach(i => {
            i.addEventListener('input', function(e) {
                const el = e.target;
                const row = (allData[active] || []).find(r => r.date === el.dataset.d && r.process === el.dataset.p);
                if (row) { row[el.dataset.f] = parseFloat(el.value) || 0; dirty = true; }
            });
        });
        document.querySelectorAll('.del-p').forEach(b => b.addEventListener('click', async function() {
            if (!confirm('删除？')) return;
            const row = (allData[active] || []).find(r => r.date === this.dataset.d && r.process === this.dataset.p);
            if (row && row.id) await db.from('production_records').delete().eq('id', row.id);
            allData[active] = (allData[active] || []).filter(r => !(r.date === this.dataset.d && r.process === this.dataset.p));
            render(); updChart();
        }));
    }

    document.addEventListener('click', function(e) {
        if (!dirty) return;
        if (e.target.tagName !== 'INPUT') {
            dirty = false;
            pending = true;
            save().then(() => { pending = false; updChart(); });
        }
    });

    document.getElementById('btnAdd').addEventListener('click', async function() {
        const d = prompt('日期 (YYYY-MM-DD)：', new Date().toISOString().split('T')[0]);
        if (!d) return;
        if ((allData[active] || []).some(r => r.date === d)) { alert('已存在'); return; }
        const rows = ['后焊','组装','包装'].map(p => ({
            date: d, process: p, prod: 0, cosProc: 0, cosMat: 0, funcProc: 0, funcMat: 0, workers: 0, hrs: 0
        }));
        allData[active] = (allData[active] || []).concat(rows);
        await save();
        await load();
    });

    function updChart() {
        if (!chart) initChart();
        const rows = allData[active] || [];
        const map = {};
        rows.forEach(r => {
            if (!map[r.date]) map[r.date] = { 后焊:0, 组装:0, 包装:0 };
            map[r.date][r.process] += r.prod;
        });
        const dates = Object.keys(map).sort();
        chart.data.labels = dates;
        chart.data.datasets[0].data = dates.map(d => map[d].后焊);
        chart.data.datasets[1].data = dates.map(d => map[d].组装);
        chart.data.datasets[2].data = dates.map(d => map[d].包装);
        chart.data.datasets[3].data = dates.map(d => map[d].后焊 + map[d].组装 + map[d].包装);
        chart.update();
    }

    function initChart() {
        if (chart) chart.destroy();
        chart = new Chart(canvas, {
            type: 'line',
            data: {
                labels: [],
                datasets: [
                    { label: '后焊', data: [], borderColor: '#FF9500' },
                    { label: '组装', data: [], borderColor: '#34C759' },
                    { label: '包装', data: [], borderColor: '#007AFF' },
                    { label: '总产量', data: [], borderColor: '#000', borderWidth: 3 }
                ]
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: true } }
            }
        });
    }

    load();
})();
</script>
</body>
</html>
