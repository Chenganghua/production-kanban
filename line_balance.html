<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生产线工位线平衡</title>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        .gantt-info strong { color: var(--blue); }
        :root {
            --bg: #f5f5f5; --card-bg: #ffffff; --border: #dcdcdc;
            --blue: #007aff; --red: #ff3b30; --text: #000000;
            --shadow: 0 1px 3px rgba(0,0,0,0.06); --radius: 8px;
            --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:var(--font); background:var(--bg); color:var(--text); padding:20px; display:flex; justify-content:center; }
        .app { width:100%; max-width:1400px; display:flex; flex-direction:column; gap:16px; }
        .top-bar { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:16px; background:var(--card-bg); border-radius:var(--radius); padding:12px 20px; box-shadow:var(--shadow); }
        .top-bar .product input { border:1px solid var(--border); border-radius:var(--radius); padding:6px 12px; font-size:16px; width:250px; }
        .top-bar .balance { font-size:16px; color:#ff6600; font-weight:600; }
        .sync-indicator { display:flex; align-items:center; gap:6px; font-size:12px; }
        .sync-dot { width:8px; height:8px; border-radius:50%; background:#34C759; }
        .sync-dot.syncing { background:#FF9500; animation:pulse 1s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
        .main-content { display:flex; gap:16px; flex-wrap:wrap; }
        .left-panel { flex:2; min-width:350px; background:var(--card-bg); border-radius:var(--radius); padding:12px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:8px; overflow-y:auto; max-height:600px; }
        .right-panel { flex:3; min-width:400px; background:var(--card-bg); border-radius:var(--radius); padding:12px; box-shadow:var(--shadow); overflow-y:auto; max-height:600px; }
        .gantt-container { position:relative; width:100%; height:500px; }
        .worker-group { border:1px solid #e0e0e0; border-radius:6px; padding:8px; margin-bottom:8px; background:#fafafa; }
        .worker-header { display:flex; align-items:center; gap:8px; margin-bottom:4px; flex-wrap:wrap; }
        .worker-header input { border:1px solid #ccc; border-radius:4px; padding:4px 8px; font-size:14px; width:150px; }
        .mode-switch { display:flex; align-items:center; gap:4px; margin-left:auto; }
        .mode-switch button { padding:4px 10px; border-radius:12px; font-size:12px; border:1px solid #ccc; background:#fff; cursor:pointer; }
        .mode-switch button.active { background:var(--blue); color:#fff; border-color:var(--blue); }
        .total-time-area { margin:6px 0; }
        .total-time-avg { font-weight:600; margin-bottom:4px; }
        .total-measurements { margin-left:16px; }
        .total-measure-row { display:flex; align-items:center; gap:4px; margin-bottom:2px; }
        .total-measure-row input { width:70px; padding:2px 4px; font-size:12px; text-align:center; border:1px solid #ddd; border-radius:4px; }
        .subtask-row { margin-left:24px; margin-bottom:4px; }
        .subtask-main { display:flex; align-items:center; gap:6px; }
        .subtask-main input { border:1px solid #ccc; border-radius:4px; padding:3px 6px; font-size:13px; width:120px; }
        .subtask-avg { font-weight:600; margin-left:8px; min-width:70px; }
        .measurements { margin-left:32px; margin-top:2px; }
        .measure-row { display:flex; align-items:center; gap:4px; margin-bottom:2px; }
        .measure-row input { width:70px; padding:2px 4px; font-size:12px; text-align:center; border:1px solid #ddd; border-radius:4px; }
        .btn { padding:6px 14px; border:none; border-radius:6px; font-size:14px; cursor:pointer; color:#fff; background:var(--blue); text-decoration:none; display:inline-flex; align-items:center; gap:4px; }
        .btn.red { background:var(--red); }
        .btn:hover { opacity:0.85; }
        .btn-delete { background:none; border:none; color:var(--red); cursor:pointer; font-size:16px; }
        .context-menu { position:absolute; background:white; border:1px solid #ccc; border-radius:4px; box-shadow:2px 2px 8px rgba(0,0,0,0.15); display:none; z-index:10; }
        .context-menu div { padding:6px 16px; cursor:pointer; }
        .context-menu div:hover { background:#f0f0f0; }
        .footer { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; background:var(--card-bg); border-radius:var(--radius); padding:10px 20px; box-shadow:var(--shadow); }
        @media (max-width: 800px) { .main-content { flex-direction:column; } }
    </style>
</head>
<body>
<div class="app">
    <div class="top-bar">
        <div class="product">
            <label>产品名称：</label>
            <input type="text" id="productName" placeholder="请输入产品名称">
        </div>
        <div class="sync-indicator">
            <span class="sync-dot" id="syncDot"></span>
            <span id="syncText">连接中...</span>
        </div>
        <div class="balance" id="balanceLabel">线平衡率：0%</div>
    </div>

    <div class="main-content">
        <div class="left-panel" id="leftPanel" oncontextmenu="return false;"></div>
        <div class="right-panel">
            <div class="gantt-info" style="display:flex; gap:20px; margin-bottom:8px; font-size:14px; font-weight:500;">
                <span>人数：<strong id="workerCount">0</strong></span>
                <span>瓶颈时间：<strong id="bottleneckTime">0s</strong></span>
                <span>平均时间：<strong id="averageTime">0s</strong></span>
            </div>
            <div class="gantt-container">
                <canvas id="ganttCanvas"></canvas>
            </div>
        </div>
    </div>

    <div class="footer">
        <div style="display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn" id="btnAddWorker">增加作业员</button>
            <button class="btn" id="btnImportExcel">导入Excel</button>
            <button class="btn" id="btnExportExcel">导出Excel</button>
            <a class="btn" href="线平衡导入模板.xlsx" download>下载导入模板</a>
            <button class="btn red" id="btnClearData">清空数据</button>
            <button class="btn" id="btnSave" style="background:#34C759;">保存</button>
        </div>
        <div style="font-size:14px; color:#666;">制作人：陈港华</div>
    </div>

    <div class="context-menu" id="contextMenu">
        <div id="menuAddMain">添加大工序</div>
        <div id="menuAddSub">添加子工序</div>
        <div id="menuDelete">删除</div>
    </div>
</div>

<script>
(function() {
    const SUPABASE_URL = 'https://heialtqbftbmtvgemrld.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_a3OQjdShFybq73P0rzpebg_pM90NvQV';
    const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
        auth: { storage: { getItem: () => null, setItem: () => {}, removeItem: () => {} } }
    });

    const urlParams = new URLSearchParams(window.location.search);
    const currentUser = urlParams.get('user') || '陈港华';
    const DEFAULT_SUBTASKS = ["打螺丝","选底座面壳","焊线","贴标","选灯头面壳"];
    let lineData = [];
    let contextTarget = null;
    let pendingSave = false;

    let productNameInput, syncDot, syncText, balanceLabel, leftPanel, canvas, contextMenu;

    function setSync(status) {
        if (!syncDot || !syncText) return;
        syncDot.className = 'sync-dot';
        if (status === 'syncing') { syncDot.classList.add('syncing'); syncText.textContent = '保存中...'; }
        else if (status === 'connected') { syncText.textContent = '已连接'; }
        else { syncDot.style.background = '#FF3B30'; syncText.textContent = '离线'; }
    }

    function average(arr) {
        if (!arr || !arr.length) return 0;
        return arr.reduce((s, v) => s + parseFloat(v) || 0, 0) / arr.length;
    }

    function getWorkerTotal(worker) {
        if (worker.isTotalMode) {
            const times = worker.totalTimes || [];
            return times.length > 0 ? average(times) : (worker.totalTime || 0);
        } else {
            return (worker.子工序 || []).reduce((sum, s) => sum + s.avgTime, 0);
        }
    }

    async function manualSave() {
        if (pendingSave) return;
        pendingSave = true;
        setSync('syncing');
        try {
            const { error } = await db
                .from('line_balance')
                .upsert({
                    board: currentUser,
                    product_name: productNameInput.value,
                    data: lineData,
                    updated_at: new Date()
                }, { onConflict: 'board' });
            if (error) throw error;
            setSync('connected');
        } catch (e) {
            console.error('保存失败:', e);
            setSync('error');
        } finally {
            pendingSave = false;
        }
    }

    async function loadFromCloud() {
        setSync('syncing');
        try {
            const { data, error } = await db
                .from('line_balance')
                .select('*')
                .eq('board', currentUser)
                .maybeSingle();
            if (error) throw error;
            if (data) {
                productNameInput.value = data.product_name || '';
                lineData = data.data || [];
                lineData.forEach(worker => {
                    worker.子工序 = (worker.子工序 || []).map(sub => {
                        if (!sub.times) { sub.times = [sub.time || 5]; sub.avgTime = average(sub.times); }
                        else { sub.avgTime = average(sub.times); }
                        return sub;
                    });
                    if (worker.isTotalMode && !worker.totalTimes) worker.totalTimes = [worker.totalTime || 0];
                });
            } else {
                productNameInput.value = '';
                lineData = [];
                initDefaultData();
            }
            setSync('connected');
        } catch (e) {
            console.error('加载失败:', e);
            setSync('error');
            if (lineData.length === 0) initDefaultData();
        }
        renderAll();
    }

    function initDefaultData() {
        lineData = [];
        for (let i = 0; i < 2; i++) {
            const subList = [];
            for (let j = 0; j < 3; j++) {
                const times = [Math.floor(Math.random() * 8) + 5];
                subList.push({ name: DEFAULT_SUBTASKS[Math.floor(Math.random() * DEFAULT_SUBTASKS.length)], times, avgTime: average(times) });
            }
            lineData.push({ 作业员: `作业员${i+1}`, 大工序: "新大工序", 子工序: subList, isTotalMode: false, totalTime: 0, totalTimes: [] });
        }
    }

    function refreshDisplay() {
        updateGantt();
        updateBalance();
        lineData.forEach((worker, wIdx) => {
            const total = getWorkerTotal(worker);
            if (worker.isTotalMode) {
                const avgEl = document.getElementById(`avg-total-${wIdx}`);
                if (avgEl) avgEl.innerHTML = `<strong>平均总时间：${total.toFixed(1)}s</strong>`;
            } else {
                (worker.子工序 || []).forEach((sub, sIdx) => {
                    const avgEl = document.getElementById(`avg-sub-${wIdx}-${sIdx}`);
                    if (avgEl) avgEl.textContent = `均 ${sub.avgTime.toFixed(1)}s`;
                });
            }
        });
    }

    function renderAll() {
        renderLeftPanel();
        updateGantt();
        updateBalance();
    }

    function addWorker() {
        const name = `作业员${lineData.length + 1}`;
        const subList = [];
        for (let i = 0; i < 3; i++) {
            const times = [Math.floor(Math.random() * 8) + 5];
            subList.push({ name: DEFAULT_SUBTASKS[Math.floor(Math.random() * DEFAULT_SUBTASKS.length)], times, avgTime: average(times) });
        }
        lineData.push({ 作业员: name, 大工序: "新大工序", 子工序: subList, isTotalMode: false, totalTime: 0, totalTimes: [] });
        renderAll();
    }

    function renderLeftPanel() {
        leftPanel.innerHTML = '';
        lineData.forEach((worker, wIdx) => {
            const group = document.createElement('div');
            group.className = 'worker-group';
            group.dataset.workerIdx = wIdx;

            const header = document.createElement('div');
            header.className = 'worker-header';
            const workerInput = document.createElement('input');
            workerInput.value = worker.作业员;
            workerInput.oninput = (e) => { worker.作业员 = e.target.value; updateGantt(); };
            header.appendChild(workerInput);

            const modeSwitch = document.createElement('div');
            modeSwitch.className = 'mode-switch';
            const modeLabel = document.createElement('span');
            modeLabel.textContent = '测量方式';
            modeLabel.style.fontSize = '12px';
            modeLabel.style.color = '#666';
            modeLabel.style.marginRight = '4px';
            modeSwitch.appendChild(modeLabel);
            const totalBtn = document.createElement('button');
            totalBtn.textContent = '总时间';
            totalBtn.className = worker.isTotalMode ? 'active' : '';
            const subBtn = document.createElement('button');
            subBtn.textContent = '子工序';
            subBtn.className = !worker.isTotalMode ? 'active' : '';
            totalBtn.onclick = () => { worker.isTotalMode = true; renderAll(); };
            subBtn.onclick = () => { worker.isTotalMode = false; renderAll(); };
            modeSwitch.appendChild(totalBtn);
            modeSwitch.appendChild(subBtn);
            header.appendChild(modeSwitch);
            group.appendChild(header);

            if (worker.isTotalMode) {
                const totalArea = document.createElement('div');
                totalArea.className = 'total-time-area';
                const avgDisplay = document.createElement('div');
                avgDisplay.id = `avg-total-${wIdx}`;
                const currentAvg = getWorkerTotal(worker);
                avgDisplay.innerHTML = `<strong>平均总时间：${currentAvg.toFixed(1)}s</strong>`;
                totalArea.appendChild(avgDisplay);

                const measurementsDiv = document.createElement('div');
                measurementsDiv.className = 'total-measurements';
                if (!worker.totalTimes) worker.totalTimes = [];
                worker.totalTimes.forEach((time, mIdx) => {
                    const row = document.createElement('div');
                    row.className = 'total-measure-row';
                    const timeInput = document.createElement('input');
                    timeInput.type = 'number';
                    timeInput.value = time;
                    timeInput.oninput = (e) => {
                        worker.totalTimes[mIdx] = parseFloat(e.target.value) || 0;
                        refreshDisplay();
                    };
                    const delBtn = document.createElement('button');
                    delBtn.textContent = '×';
                    delBtn.style.border = 'none'; delBtn.style.background = 'none'; delBtn.style.color = 'red'; delBtn.style.cursor = 'pointer';
                    delBtn.onclick = () => {
                        worker.totalTimes.splice(mIdx, 1);
                        if (worker.totalTimes.length === 0) worker.totalTimes = [0];
                        renderAll();
                    };
                    row.appendChild(timeInput);
                    row.appendChild(delBtn);
                    measurementsDiv.appendChild(row);
                });
                totalArea.appendChild(measurementsDiv);

                const addBtn = document.createElement('button');
                addBtn.textContent = '+ 添加测量值';
                addBtn.className = 'btn';
                addBtn.style.padding = '2px 10px';
                addBtn.onclick = () => { if (!worker.totalTimes) worker.totalTimes = []; worker.totalTimes.push(0); renderAll(); };
                totalArea.appendChild(addBtn);
                group.appendChild(totalArea);
            } else {
                worker.子工序.forEach((sub, sIdx) => {
                    const subRow = document.createElement('div');
                    subRow.className = 'subtask-row';
                    subRow.dataset.workerIdx = wIdx;
                    subRow.dataset.subIdx = sIdx;

                    const mainLine = document.createElement('div');
                    mainLine.className = 'subtask-main';
                    const nameInput = document.createElement('input');
                    nameInput.value = sub.name;
                    nameInput.oninput = (e) => { sub.name = e.target.value; updateGantt(); };
                    const avgDisplay = document.createElement('span');
                    avgDisplay.className = 'subtask-avg';
                    avgDisplay.id = `avg-sub-${wIdx}-${sIdx}`;
                    avgDisplay.textContent = `均 ${sub.avgTime.toFixed(1)}s`;
                    const addMeasureBtn = document.createElement('button');
                    addMeasureBtn.textContent = '+测量';
                    addMeasureBtn.className = 'btn';
                    addMeasureBtn.style.padding = '2px 8px';
                    addMeasureBtn.onclick = () => { if (!sub.times) sub.times = []; sub.times.push(0); sub.avgTime = average(sub.times); renderAll(); };
                    const delBtn = document.createElement('button');
                    delBtn.className = 'btn-delete';
                    delBtn.textContent = '✕';
                    delBtn.onclick = () => { worker.子工序.splice(sIdx, 1); renderAll(); };

                    mainLine.appendChild(nameInput);
                    mainLine.appendChild(avgDisplay);
                    mainLine.appendChild(addMeasureBtn);
                    mainLine.appendChild(delBtn);
                    subRow.appendChild(mainLine);

                    const measurements = document.createElement('div');
                    measurements.className = 'measurements';
                    sub.times.forEach((time, mIdx) => {
                        const measRow = document.createElement('div');
                        measRow.className = 'measure-row';
                        const timeInput = document.createElement('input');
                        timeInput.type = 'number';
                        timeInput.value = time;
                        timeInput.oninput = (e) => {
                            sub.times[mIdx] = parseFloat(e.target.value) || 0;
                            sub.avgTime = average(sub.times);
                            refreshDisplay();
                        };
                        const delMeasBtn = document.createElement('button');
                        delMeasBtn.textContent = '×';
                        delMeasBtn.style.border = 'none'; delMeasBtn.style.background = 'none'; delMeasBtn.style.color = 'red'; delMeasBtn.style.cursor = 'pointer';
                        delMeasBtn.onclick = () => {
                            sub.times.splice(mIdx, 1);
                            if (sub.times.length === 0) sub.times = [0];
                            sub.avgTime = average(sub.times);
                            renderAll();
                        };
                        measRow.appendChild(timeInput);
                        measRow.appendChild(delMeasBtn);
                        measurements.appendChild(measRow);
                    });
                    subRow.appendChild(measurements);
                    group.appendChild(subRow);
                });

                const addBtn = document.createElement('button');
                addBtn.textContent = '+ 添加子工序';
                addBtn.className = 'btn';
                addBtn.style.marginLeft = '24px';
                addBtn.onclick = () => { worker.子工序.push({ name: DEFAULT_SUBTASKS[0], times: [5], avgTime: 5 }); renderAll(); };
                group.appendChild(addBtn);
            }

            leftPanel.appendChild(group);
        });

        document.querySelectorAll('.worker-group').forEach(group => {
            group.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                contextTarget = { type: 'worker', idx: parseInt(group.dataset.workerIdx) };
                showContextMenu(e.pageX, e.pageY);
            });
        });
        document.querySelectorAll('.subtask-row').forEach(row => {
            row.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                const wIdx = parseInt(row.dataset.workerIdx);
                const sIdx = parseInt(row.dataset.subIdx);
                contextTarget = { type: 'subtask', wIdx, sIdx };
                showContextMenu(e.pageX, e.pageY);
            });
        });
    }

    function showContextMenu(x, y) {
        contextMenu.style.left = x + 'px';
        contextMenu.style.top = y + 'px';
        contextMenu.style.display = 'block';
        const isWorker = contextTarget.type === 'worker';
        document.getElementById('menuAddMain').style.display = isWorker ? 'block' : 'none';
        document.getElementById('menuAddSub').style.display = isWorker ? 'none' : 'block';
    }

    document.addEventListener('click', () => { contextMenu.style.display = 'none'; });

    function addMainProcess() { if (!contextTarget || contextTarget.type !== 'worker') return; lineData[contextTarget.idx].大工序 = '新大工序'; renderAll(); }
    function addSubTask() { if (!contextTarget || contextTarget.type !== 'subtask') return; lineData[contextTarget.wIdx].子工序.push({ name: DEFAULT_SUBTASKS[0], times: [5], avgTime: 5 }); renderAll(); }
    function deleteItem() { if (!contextTarget) return; if (contextTarget.type === 'worker') lineData.splice(contextTarget.idx, 1); else lineData[contextTarget.wIdx].子工序.splice(contextTarget.sIdx, 1); renderAll(); }

    function updateGantt() {
        const ctx = canvas.getContext('2d');
        const container = canvas.parentElement;
        const dpr = window.devicePixelRatio || 1;
        canvas.width = container.clientWidth * dpr;
        canvas.height = container.clientHeight * dpr;
        canvas.style.width = container.clientWidth + 'px';
        canvas.style.height = container.clientHeight + 'px';
        ctx.scale(dpr, dpr);
        ctx.clearRect(0, 0, container.clientWidth, container.clientHeight);
        if (lineData.length === 0) {
            document.getElementById('workerCount').textContent = '0';
            document.getElementById('bottleneckTime').textContent = '0s';
            document.getElementById('averageTime').textContent = '0s';
            return;
        }
        document.getElementById('workerCount').textContent = lineData.length;

        const barHeight = Math.min(36, (container.clientHeight - 60) / lineData.length);
        const startY = 10;
        const leftMargin = 100;
        const barStartX = leftMargin + 10;
        const timeTextWidth = 60;
        const barMaxWidth = container.clientWidth - barStartX - timeTextWidth - 10;
        const colors = ['#007aff', '#34c759', '#ff9500', '#af52de', '#5ac8fa'];
        let maxTime = 0;
        lineData.forEach(w => { const total = getWorkerTotal(w); if (total > maxTime) maxTime = total; });
        if (maxTime === 0) {
            document.getElementById('bottleneckTime').textContent = '0s';
            document.getElementById('averageTime').textContent = '0s';
            return;
        }

        document.getElementById('bottleneckTime').textContent = maxTime.toFixed(1) + 's';
        const totalSum = lineData.reduce((sum, w) => sum + getWorkerTotal(w), 0);
        const avgTime = totalSum / lineData.length;
        document.getElementById('averageTime').textContent = avgTime.toFixed(1) + 's';

        lineData.forEach((w, i) => {
            let left = 0;
            const y = startY + i * (barHeight + 12);
            const total = getWorkerTotal(w);
            if (total === maxTime) {
                ctx.fillStyle = 'rgba(255,59,48,0.3)';
                ctx.fillRect(barStartX, y - 2, barMaxWidth, barHeight + 4);
            }
            if (w.isTotalMode) {
                const width = (total / maxTime) * barMaxWidth;
                ctx.fillStyle = '#007aff';
                ctx.fillRect(barStartX + left, y, width, barHeight);
            } else {
                w.子工序.forEach((s, j) => {
                    const width = (s.avgTime / maxTime) * barMaxWidth;
                    ctx.fillStyle = colors[j % colors.length];
                    ctx.fillRect(barStartX + left, y, width, barHeight);
                    ctx.fillStyle = '#ffffff';
                    ctx.font = `bold ${Math.max(10, barHeight * 0.35)}px sans-serif`;
                    const textWidth = ctx.measureText(s.name).width;
                    if (textWidth < width - 4) {
                        ctx.fillText(s.name, barStartX + left + 4, y + barHeight / 2 + 4);
                    }
                    left += width;
                });
            }
            const totalText = total.toFixed(1) + 's';
            ctx.fillStyle = '#000';
            ctx.font = `bold ${Math.max(10, barHeight * 0.4)}px sans-serif`;
            ctx.fillText(totalText, barStartX + (w.isTotalMode ? (total / maxTime) * barMaxWidth : left) + 4, y + barHeight / 2 + 4);
            ctx.fillStyle = '#000';
            ctx.font = `bold ${Math.max(12, barHeight * 0.45)}px sans-serif`;
            ctx.fillText(w.作业员, 5, y + barHeight / 2 + 4);
        });
    }

    function updateBalance() {
        if (lineData.length === 0) { balanceLabel.textContent = '线平衡率：0%'; return; }
        const times = lineData.map(w => getWorkerTotal(w));
        const balance = Math.round((Math.min(...times) / Math.max(...times)) * 100);
        balanceLabel.textContent = `线平衡率：${balance}%`;
    }

    function importExcel() {
        const input = document.createElement('input'); input.type = 'file'; input.accept = '.xlsx';
        input.onchange = (e) => {
            const file = e.target.files[0]; const reader = new FileReader();
            reader.onload = (ev) => {
                const data = new Uint8Array(ev.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const json = XLSX.utils.sheet_to_json(sheet);
                const firstRow = json[0] || {};
                if ('子工序' in firstRow && '时间' in firstRow) {
                    const map = new Map();
                    json.forEach(row => {
                        const worker = row['作业员'] || '', main = row['大工序'] || '', subName = row['子工序'] || '', time = parseFloat(row['时间']) || 0;
                        if (!worker || !subName) return;
                        const key = worker + '||' + main;
                        if (!map.has(key)) map.set(key, { 作业员: worker, 大工序: main, 子工序: [], isTotalMode: false, totalTime: 0, totalTimes: [] });
                        const existing = map.get(key).子工序.find(s => s.name === subName);
                        if (existing) { existing.times.push(time); existing.avgTime = average(existing.times); }
                        else map.get(key).子工序.push({ name: subName, times: [time], avgTime: time });
                    });
                    lineData = Array.from(map.values());
                } else {
                    lineData = [];
                    json.forEach(row => {
                        const subList = [];
                        Object.keys(row).forEach(col => { if (col !== '作业员' && col !== '大工序' && col !== 'isTotalMode' && col !== 'totalTime' && col !== 'totalTimes') { const v = parseFloat(row[col])||0; subList.push({ name: col, times: [v], avgTime: v }); } });
                        let totalTimes = [];
                        if (row['totalTimes']) totalTimes = String(row['totalTimes']).split(',').map(v => parseFloat(v)||0);
                        else if (row['totalTime']) totalTimes = [parseFloat(row['totalTime'])||0];
                        lineData.push({ 作业员: row['作业员']||'', 大工序: row['大工序']||'', 子工序: subList, isTotalMode: row['isTotalMode']===true||row['isTotalMode']==='true', totalTime: parseFloat(row['totalTime'])||0, totalTimes });
                    });
                }
                renderAll();
            };
            reader.readAsArrayBuffer(file);
        };
        input.click();
    }

    function exportExcel() {
        const data = [];
        lineData.forEach(w => {
            if (w.isTotalMode) {
                data.push({ 作业员: w.作业员, 大工序: w.大工序, 子工序: '', 平均时间: getWorkerTotal(w).toFixed(1), 测量值: (w.totalTimes||[]).join(','), isTotalMode: true, totalTime: getWorkerTotal(w) });
            } else {
                w.子工序.forEach(s => { data.push({ 作业员: w.作业员, 大工序: w.大工序, 子工序: s.name, 平均时间: s.avgTime.toFixed(1), 测量值: s.times.join(','), isTotalMode: false, totalTime: 0 }); });
            }
        });
        const ws = XLSX.utils.json_to_sheet(data); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, "Sheet1");
        XLSX.writeFile(wb, "线平衡数据.xlsx");
    }

    function clearData() { if (confirm('确定清空数据？')) { lineData = []; productNameInput.value = ''; renderAll(); } }

    window.addEventListener('resize', () => updateGantt());

    window.addEventListener('DOMContentLoaded', () => {
        productNameInput = document.getElementById('productName');
        syncDot = document.getElementById('syncDot');
        syncText = document.getElementById('syncText');
        balanceLabel = document.getElementById('balanceLabel');
        leftPanel = document.getElementById('leftPanel');
        canvas = document.getElementById('ganttCanvas');
        contextMenu = document.getElementById('contextMenu');

        const leftPanelEl = document.getElementById('leftPanel');
        const rightPanelEl = document.querySelector('.right-panel');
        if (leftPanelEl && rightPanelEl) {
            leftPanelEl.addEventListener('scroll', () => { rightPanelEl.scrollTop = leftPanelEl.scrollTop; });
            rightPanelEl.addEventListener('scroll', () => { leftPanelEl.scrollTop = rightPanelEl.scrollTop; });
        }

        document.getElementById('btnAddWorker').addEventListener('click', addWorker);
        document.getElementById('btnImportExcel').addEventListener('click', importExcel);
        document.getElementById('btnExportExcel').addEventListener('click', exportExcel);
        document.getElementById('btnClearData').addEventListener('click', clearData);
        document.getElementById('menuAddMain').addEventListener('click', addMainProcess);
        document.getElementById('menuAddSub').addEventListener('click', addSubTask);
        document.getElementById('menuDelete').addEventListener('click', deleteItem);
        document.getElementById('btnSave').addEventListener('click', manualSave);

        (async () => {
            await loadFromCloud();
            if (lineData.length === 0) { initDefaultData(); renderAll(); await manualSave(); }
            setSync('connected');
        })();
    });
})();
</script>
